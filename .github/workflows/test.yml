name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-unit-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gmssl==3.2.2 "cryptography>=42.0.0" aiohttp pytest ruff tzdata
      - name: Lint
        run: ruff check custom_components tests
      - name: Unit + contract tests
        run: pytest -q

  ha-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hass: "2026.10.2"
            py: "3.14"
            aiodns: "4.0.4"
          - hass: "2026.4.4"
            py: "3.14"
            aiodns: "4.0.4"
          - hass: "2025.7.4"
            py: "3.13"
            aiodns: "3.5.0"
            legacy: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install Home Assistant ${{ matrix.hass }}
        # 2025.7 已停支持，aiodns/pycares 解析在其依赖链上有已知不兼容；
        # 保留为继续观察的实验针（continue-on-error），不阻塞主线质量门
        continue-on-error: ${{ matrix.legacy == true }}
        run: |
          python -m pip install --upgrade pip
          pip install "homeassistant==${{ matrix.hass }}" gmssl==3.2.2 "cryptography>=42.0.0" "aiodns==${{ matrix.aiodns }}" "pycares>=4.9.0"
          python -c "import aiohttp, aiodns, pycares; print('aiohttp', aiohttp.__version__, 'aiodns', aiodns.__version__, 'pycares', pycares.__version__)"
      - name: Import smoke (catches removed-API breakage)
        run: python scripts/ha_import_smoke.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
